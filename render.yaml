services:
  - type: web
    name: sentimentscope-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
